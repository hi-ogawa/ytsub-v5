<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c60"/></marker>
    <style>
      .c { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #36a; }
      .oc { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #a50; }
      .t { font-weight: bold; }
      .s { fill: #666; font-size: 11px; }
      .box { fill: #fff; stroke: #557; }
      .ext { fill: #fff; stroke: #557; stroke-dasharray: 5 3; }
      .store { fill: #fdfaf2; stroke: #a96; }
      .line { stroke: #333; fill: none; }
      .bc { stroke: #c60; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="1000" height="560" fill="#fff"/>

  <!-- YouTube tab -->
  <rect x="20" y="40" width="580" height="310" rx="8" fill="#f3f5fc" stroke="#99b"/>
  <text x="34" y="62" class="t" fill="#557">YouTube tab <tspan class="s" font-weight="normal">(one per open tab, on https://www.youtube.com)</tspan></text>

  <rect x="40" y="90" width="200" height="120" rx="6" class="box"/>
  <text x="140" y="114" text-anchor="middle" class="t">Content script</text>
  <text x="140" y="132" text-anchor="middle" class="c">MAIN world</text>
  <text x="140" y="152" text-anchor="middle" class="s">sees YouTube's page globals</text>
  <text x="140" y="168" text-anchor="middle" class="s">renders the caption panel</text>
  <text x="140" y="184" text-anchor="middle" class="s">keeps a copy of the index</text>
  <text x="140" y="200" text-anchor="middle" class="s">no chrome.* APIs</text>

  <rect x="400" y="90" width="180" height="90" rx="6" class="box"/>
  <text x="490" y="114" text-anchor="middle" class="t">Relay</text>
  <text x="490" y="132" text-anchor="middle" class="c">ISOLATED world</text>
  <text x="490" y="152" text-anchor="middle" class="s">has chrome.* APIs</text>
  <text x="490" y="168" text-anchor="middle" class="s">forwards calls, no UI</text>

  <rect x="400" y="230" width="180" height="100" rx="6" class="ext"/>
  <text x="490" y="254" text-anchor="middle" class="t">Storage frame</text>
  <text x="490" y="272" text-anchor="middle" class="c">chrome-extension:// origin</text>
  <text x="490" y="292" text-anchor="middle" class="s">hidden iframe</text>
  <text x="490" y="308" text-anchor="middle" class="s">opens the extension's IndexedDB</text>

  <line x1="244" y1="130" x2="396" y2="130" class="line" marker-end="url(#a)"/>
  <text x="320" y="124" text-anchor="middle" class="c">zamak:rpc</text>
  <line x1="490" y1="184" x2="490" y2="226" class="line" marker-end="url(#a)"/>
  <text x="498" y="210" class="s">mounts</text>
  <path d="M 244 180 L 320 180 L 320 270 L 396 270" class="line" marker-end="url(#a)"/>
  <text x="328" y="226" class="c">postMessage</text>
  <text x="328" y="240" class="s">reads, writes</text>
  <path d="M 396 304 L 300 304 L 300 196 L 244 196" class="bc" marker-end="url(#o)"/>
  <text x="308" y="320" class="oc">notices</text>

  <!-- Server -->
  <rect x="680" y="20" width="280" height="50" rx="6" class="box"/>
  <text x="820" y="41" text-anchor="middle" class="t">Server</text>
  <text x="820" y="58" text-anchor="middle" class="s">Cloudflare Worker + D1</text>

  <!-- Background -->
  <rect x="680" y="100" width="280" height="100" rx="6" class="box"/>
  <text x="820" y="124" text-anchor="middle" class="t">Background service worker</text>
  <text x="820" y="146" text-anchor="middle" class="s">handles calls from the caption panel</text>
  <text x="820" y="162" text-anchor="middle" class="s">calls the server with the session token</text>
  <text x="820" y="178" text-anchor="middle" class="s">from chrome.storage.local</text>
  <line x1="820" y1="96" x2="820" y2="74" class="line" marker-end="url(#a)"/>
  <line x1="584" y1="130" x2="676" y2="130" class="line" marker-end="url(#a)"/>
  <text x="630" y="124" text-anchor="middle" class="c">sendMessage</text>

  <!-- Bookmarks page -->
  <rect x="680" y="230" width="280" height="100" rx="6" class="box"/>
  <text x="820" y="254" text-anchor="middle" class="t">Bookmarks page</text>
  <text x="820" y="272" text-anchor="middle" class="c">chrome-extension:// origin</text>
  <text x="820" y="292" text-anchor="middle" class="s">opens the extension's IndexedDB</text>
  <text x="820" y="308" text-anchor="middle" class="s">calls the server for sign-in and sync</text>

  <!-- Extension storage -->
  <rect x="400" y="390" width="560" height="100" rx="6" class="store"/>
  <text x="680" y="414" text-anchor="middle" class="t">Extension IndexedDB <tspan class="c" font-weight="normal">zamak</tspan></text>
  <text x="680" y="434" text-anchor="middle" class="s">caption sessions and the video index, one record each per video</text>
  <text x="680" y="452" text-anchor="middle" class="s">shared by the storage frame in every tab, the bookmarks page, and the background</text>
  <text x="680" y="474" text-anchor="middle" class="oc">BroadcastChannel zamak:storage announces each write</text>
  <line x1="490" y1="334" x2="490" y2="386" class="line" marker-end="url(#a)"/>
  <line x1="820" y1="334" x2="820" y2="386" class="line" marker-end="url(#a)"/>
  <path d="M 964 150 L 985 150 L 985 440 L 964 440" class="line" marker-end="url(#a)"/>
  <text x="978" y="300" text-anchor="middle" class="s" transform="rotate(-90 978 300)">reads a session to push</text>

  <!-- Legacy storage -->
  <rect x="40" y="390" width="300" height="100" rx="6" class="store"/>
  <text x="190" y="414" text-anchor="middle" class="t">youtube.com storage</text>
  <text x="190" y="434" text-anchor="middle" class="s">where earlier versions kept sessions</text>
  <text x="190" y="450" text-anchor="middle" class="s">and the index, left in place</text>
  <line x1="140" y1="386" x2="140" y2="214" class="line" marker-end="url(#a)"/>
  <text x="148" y="290" class="s">read once to migrate</text>

  <!-- Legend -->
  <line x1="40" y1="520" x2="90" y2="520" class="line"/>
  <text x="100" y="524">call, pointing from caller to callee: the response comes back on the same line</text>
  <line x1="40" y1="544" x2="90" y2="544" class="bc"/>
  <text x="100" y="548">change notice, no response</text>
  <rect x="300" y="535" width="50" height="18" rx="4" fill="#fdfaf2" stroke="#a96"/>
  <text x="360" y="548">storage</text>
</svg>
