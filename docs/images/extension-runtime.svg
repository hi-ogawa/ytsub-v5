<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c60"/></marker>
    <style>
      .c { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #36a; }
      .oc { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #a50; }
      .t { font-weight: bold; }
      .s { fill: #666; font-size: 11px; }
      .box { fill: #fff; stroke: #557; }
      .line { stroke: #333; fill: none; }
      .bc { stroke: #c60; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="1000" height="540" fill="#fff"/>

  <!-- YouTube tab -->
  <rect x="20" y="40" width="560" height="340" rx="8" fill="#f3f5fc" stroke="#99b"/>
  <text x="34" y="62" class="t" fill="#557">YouTube tab <tspan class="s" font-weight="normal">(one per open tab, all on https://www.youtube.com)</tspan></text>

  <rect x="40" y="100" width="200" height="110" rx="6" class="box"/>
  <text x="140" y="124" text-anchor="middle" class="t">Content script</text>
  <text x="140" y="142" text-anchor="middle" class="c">MAIN world</text>
  <text x="140" y="162" text-anchor="middle" class="s">sees YouTube's page globals</text>
  <text x="140" y="178" text-anchor="middle" class="s">renders the caption panel</text>
  <text x="140" y="194" text-anchor="middle" class="s">no chrome.* APIs</text>

  <rect x="380" y="100" width="180" height="110" rx="6" class="box"/>
  <text x="470" y="124" text-anchor="middle" class="t">Relay</text>
  <text x="470" y="142" text-anchor="middle" class="c">ISOLATED world</text>
  <text x="470" y="162" text-anchor="middle" class="s">has chrome.* APIs</text>
  <text x="470" y="178" text-anchor="middle" class="s">forwards messages</text>
  <text x="470" y="194" text-anchor="middle" class="s">no UI</text>

  <!-- Channels between the worlds -->
  <line x1="244" y1="130" x2="376" y2="130" class="line" marker-end="url(#a)"/>
  <text x="310" y="124" text-anchor="middle" class="c">zamak:rpc</text>
  <line x1="244" y1="162" x2="376" y2="162" class="line" marker-start="url(#a)"/>
  <text x="310" y="156" text-anchor="middle" class="c">zamak:tab-rpc</text>
  <line x1="244" y1="194" x2="376" y2="194" class="bc" marker-end="url(#o)"/>
  <text x="310" y="188" text-anchor="middle" class="oc">zamak:store</text>

  <rect x="40" y="270" width="520" height="90" rx="6" fill="#fdfaf2" stroke="#a96"/>
  <text x="300" y="294" text-anchor="middle" class="t">youtube.com storage</text>
  <text x="300" y="312" text-anchor="middle" class="s">shared by every YouTube tab and by both worlds</text>
  <text x="300" y="332" text-anchor="middle" class="s"><tspan class="c">IndexedDB</tspan>: caption sessions</text>
  <text x="300" y="348" text-anchor="middle" class="s"><tspan class="c">localStorage</tspan>: video index</text>
  <line x1="140" y1="214" x2="140" y2="266" class="line" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="148" y="244" class="s">sessions, index</text>
  <line x1="470" y1="214" x2="470" y2="266" class="line" marker-end="url(#a)"/>
  <text x="478" y="244" class="s">index at load</text>

  <!-- Server -->
  <rect x="680" y="20" width="280" height="50" rx="6" class="box"/>
  <text x="820" y="41" text-anchor="middle" class="t">Server</text>
  <text x="820" y="58" text-anchor="middle" class="s">Cloudflare Worker + D1</text>

  <!-- Background -->
  <rect x="680" y="100" width="280" height="110" rx="6" class="box"/>
  <text x="820" y="124" text-anchor="middle" class="t">Background service worker</text>
  <text x="820" y="146" text-anchor="middle" class="s">handles calls from the tab and the page</text>
  <text x="820" y="162" text-anchor="middle" class="s">calls the server with the session token</text>
  <text x="820" y="178" text-anchor="middle" class="s">tracks which YouTube tabs are ready</text>
  <text x="820" y="194" text-anchor="middle" class="s">no UI, no captions</text>
  <line x1="820" y1="96" x2="820" y2="74" class="line" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Relay to background -->
  <line x1="564" y1="130" x2="676" y2="130" class="line" marker-end="url(#a)"/>
  <text x="620" y="124" text-anchor="middle" class="c">sendMessage</text>
  <line x1="564" y1="162" x2="676" y2="162" class="line" marker-start="url(#a)"/>
  <text x="620" y="156" text-anchor="middle" class="c">tabs.sendMessage</text>
  <line x1="564" y1="194" x2="676" y2="194" class="line" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="620" y="188" text-anchor="middle" class="c">port</text>

  <!-- chrome.storage.local -->
  <rect x="680" y="270" width="280" height="90" rx="6" fill="#fdfaf2" stroke="#a96"/>
  <text x="820" y="294" text-anchor="middle" class="t">chrome.storage.local</text>
  <text x="820" y="314" text-anchor="middle" class="s">shared by the whole extension</text>
  <text x="820" y="332" text-anchor="middle" class="s">video index, session token, server URL</text>
  <line x1="820" y1="214" x2="820" y2="266" class="line" marker-end="url(#a)"/>
  <text x="828" y="244" class="s">reads token</text>
  <path d="M 564 206 L 676 296" class="line" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="626" y="270" text-anchor="end" class="s">index</text>

  <!-- Bookmarks page -->
  <rect x="680" y="420" width="280" height="100" rx="6" class="box"/>
  <text x="820" y="444" text-anchor="middle" class="t">Bookmarks page</text>
  <text x="820" y="462" text-anchor="middle" class="c">chrome-extension:// origin</text>
  <text x="820" y="482" text-anchor="middle" class="s">has chrome.* APIs, own localStorage</text>
  <text x="820" y="498" text-anchor="middle" class="s">calls the server directly for</text>
  <text x="820" y="512" text-anchor="middle" class="s">sign-in, video list, and delete</text>
  <line x1="820" y1="416" x2="820" y2="364" class="line" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="828" y="394" class="s">index, token</text>
  <path d="M 964 470 L 985 470 L 985 150 L 964 150" class="line" marker-end="url(#a)"/>
  <text x="978" y="310" text-anchor="middle" class="c" transform="rotate(-90 978 310)">sendMessage: push, pull</text>

  <!-- Legend -->
  <line x1="40" y1="430" x2="90" y2="430" class="bc"/>
  <text x="100" y="434">BroadcastChannel notice, no response: also reaches every other YouTube tab</text>
  <line x1="40" y1="456" x2="90" y2="456" class="line"/>
  <text x="100" y="460">call, pointing from caller to callee: the response comes back on the same line</text>
  <line x1="40" y1="482" x2="90" y2="482" class="line" stroke-dasharray="5 4"/>
  <text x="100" y="486">long-lived port, closes when the tab goes away</text>
  <rect x="40" y="500" width="50" height="18" rx="4" fill="#fdfaf2" stroke="#a96"/>
  <text x="100" y="513">storage</text>
</svg>
