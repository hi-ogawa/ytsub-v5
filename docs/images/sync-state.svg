<svg xmlns="http://www.w3.org/2000/svg" width="900" height="554" viewBox="0 0 900 554" font-family="system-ui, sans-serif" font-size="13">
  <rect width="900" height="554" fill="#fff"/>
  <rect x="20" y="16" width="860" height="62" rx="6" fill="#f7f7f9" stroke="#ccd"/>
  <text x="36" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan font-weight="600">local changed </tspan> = editedAt ≠ syncedEditedAt</text>
  <text x="36" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13"><tspan font-weight="600">server changed</tspan> = server's edited_at ≠ syncedEditedAt</text>
  <text x="560" y="42" fill="#666" font-size="12">editedAt and syncedEditedAt are on this device.</text>
  <text x="560" y="64" fill="#666" font-size="12">Only equality is checked, never which is later.</text>
  <g font-weight="600" fill="#222" font-size="12">
    <text x="290" y="106">On this device</text>
    <text x="530" y="106">On the server</text>
    <text x="680" y="106" text-anchor="middle">Local</text>
    <text x="760" y="106" text-anchor="middle">Server</text>
  </g>
  <g fill="#666" font-size="12">
    <text x="290" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">editedAt</text>
    <text x="400" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">syncedEditedAt</text>
    <text x="530" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">edited_at</text>
    <text x="680" y="124" text-anchor="middle">changed?</text>
    <text x="760" y="124" text-anchor="middle">changed?</text>
    <text x="815" y="124" font-weight="600" fill="#222">Status</text>
  </g>
  <line x1="20" y1="134" x2="880" y2="134" stroke="#ccd"/>
  <text x="20" y="158" font-weight="600" fill="#222">Synced before, and both copies exist</text>
  <g>
    <text x="20" y="188">Neither side edited</text>
    <rect x="290" y="170" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="302" y="188">10:00</text>
    <rect x="400" y="170" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="412" y="188">10:00</text>
    <rect x="530" y="170" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="542" y="188">10:00</text>
    <text x="680" y="188" text-anchor="middle" fill="#999">no</text>
    <text x="760" y="188" text-anchor="middle" fill="#999">no</text>
    <text x="815" y="188" font-weight="600" fill="#2a7a2a">synced</text>
  </g>
  <g>
    <text x="20" y="228">This device edited</text>
    <rect x="290" y="210" width="96" height="26" rx="4" fill="#ffe9c7" stroke="#c98a00"/><text x="302" y="228">10:58</text>
    <rect x="400" y="210" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="412" y="228">10:00</text>
    <rect x="530" y="210" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="542" y="228">10:00</text>
    <text x="680" y="228" text-anchor="middle" fill="#222">yes</text>
    <text x="760" y="228" text-anchor="middle" fill="#999">no</text>
    <text x="815" y="228" font-weight="600" fill="#8a5a00">push</text>
  </g>
  <g>
    <text x="20" y="268">The server's copy was edited</text>
    <rect x="290" y="250" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="302" y="268">10:00</text>
    <rect x="400" y="250" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="412" y="268">10:00</text>
    <rect x="530" y="250" width="96" height="26" rx="4" fill="#ffe9c7" stroke="#c98a00"/><text x="542" y="268">10:59</text>
    <text x="680" y="268" text-anchor="middle" fill="#999">no</text>
    <text x="760" y="268" text-anchor="middle" fill="#222">yes</text>
    <text x="815" y="268" font-weight="600" fill="#1f5fb5">pull</text>
  </g>
  <g>
    <text x="20" y="308">Both edited</text>
    <rect x="290" y="290" width="96" height="26" rx="4" fill="#ffe9c7" stroke="#c98a00"/><text x="302" y="308">10:58</text>
    <rect x="400" y="290" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="412" y="308">10:00</text>
    <rect x="530" y="290" width="96" height="26" rx="4" fill="#ffe9c7" stroke="#c98a00"/><text x="542" y="308">10:59</text>
    <text x="680" y="308" text-anchor="middle" fill="#222">yes</text>
    <text x="760" y="308" text-anchor="middle" fill="#222">yes</text>
    <text x="815" y="308" font-weight="600" fill="#a22">conflict</text>
  </g>
  <text x="20" y="342" font-weight="600" fill="#222">A copy or the sync record is missing, checked first</text>
  <text x="440" y="342" fill="#666" font-size="12">The checks don't apply, so these rules decide.</text>
  <g>
    <text x="20" y="365">Only on the server</text>
    <text x="20" y="381" fill="#666" font-size="12">no local copy</text>
    <rect x="290" y="354" width="96" height="26" rx="4" fill="#fff" stroke="#bbb" stroke-dasharray="3 3"/><text x="302" y="372" fill="#999">none</text>
    <rect x="400" y="354" width="96" height="26" rx="4" fill="#fff" stroke="#bbb" stroke-dasharray="3 3"/><text x="412" y="372" fill="#999">none</text>
    <rect x="530" y="354" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="542" y="372">10:59</text>
    <text x="680" y="372" text-anchor="middle" fill="#999">–</text>
    <text x="760" y="372" text-anchor="middle" fill="#999">–</text>
    <text x="815" y="372" font-weight="600" fill="#1f5fb5">pull</text>
  </g>
  <g>
    <text x="20" y="405">Never synced, not on the server</text>
    <text x="20" y="421" fill="#666" font-size="12">nothing to compare with</text>
    <rect x="290" y="394" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="302" y="412">10:58</text>
    <rect x="400" y="394" width="96" height="26" rx="4" fill="#fff" stroke="#bbb" stroke-dasharray="3 3"/><text x="412" y="412" fill="#999">none</text>
    <rect x="530" y="394" width="96" height="26" rx="4" fill="#fff" stroke="#bbb" stroke-dasharray="3 3"/><text x="542" y="412" fill="#999">none</text>
    <text x="680" y="412" text-anchor="middle" fill="#999">–</text>
    <text x="760" y="412" text-anchor="middle" fill="#999">–</text>
    <text x="815" y="412" font-weight="600" fill="#8a5a00">push</text>
  </g>
  <g>
    <text x="20" y="445">Never synced, on the server</text>
    <text x="20" y="461" fill="#666" font-size="12">no record of which is newer</text>
    <rect x="290" y="434" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="302" y="452">10:58</text>
    <rect x="400" y="434" width="96" height="26" rx="4" fill="#fff" stroke="#bbb" stroke-dasharray="3 3"/><text x="412" y="452" fill="#999">none</text>
    <rect x="530" y="434" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="542" y="452">10:59</text>
    <text x="680" y="452" text-anchor="middle" fill="#999">–</text>
    <text x="760" y="452" text-anchor="middle" fill="#999">–</text>
    <text x="815" y="452" font-weight="600" fill="#a22">conflict</text>
  </g>
  <g>
    <text x="20" y="485">Synced, then removed from the server</text>
    <text x="20" y="501" fill="#666" font-size="12">the server lost its copy</text>
    <rect x="290" y="474" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="302" y="492">10:00</text>
    <rect x="400" y="474" width="96" height="26" rx="4" fill="#f3f3f3" stroke="#888"/><text x="412" y="492">10:00</text>
    <rect x="530" y="474" width="96" height="26" rx="4" fill="#fff" stroke="#bbb" stroke-dasharray="3 3"/><text x="542" y="492" fill="#999">none</text>
    <text x="680" y="492" text-anchor="middle" fill="#999">–</text>
    <text x="760" y="492" text-anchor="middle" fill="#999">–</text>
    <text x="815" y="492" font-weight="600" fill="#8a5a00">push</text>
  </g>
  <rect x="20" y="520" width="14" height="14" rx="3" fill="#ffe9c7" stroke="#c98a00"/>
  <text x="42" y="532">differs from syncedEditedAt, so that side changed. Times are examples, each from the clock of whichever side made the edit.</text>
</svg>
