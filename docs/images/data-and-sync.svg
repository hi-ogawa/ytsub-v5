<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7"/></marker>
    <style>
      .t { font-weight: bold; }
      .s { fill: #666; font-size: 11px; }
      .grp { fill: #f3f5fc; stroke: #99b; }
      .gl { font-weight: bold; fill: #557; }
      .store { fill: #fdfaf2; stroke: #a96; }
      .line { stroke: #333; fill: none; }
      .sync { stroke: #2a7; stroke-width: 1.5; fill: none; }
      .st { fill: #186; font-weight: bold; font-size: 12px; }
    </style>
  </defs>
  <rect width="1000" height="360" fill="#fff"/>

  <!-- Extension -->
  <rect x="20" y="30" width="300" height="300" rx="8" class="grp"/>
  <text x="34" y="52" class="gl">Extension <tspan class="s" font-weight="normal">(its own origin)</tspan></text>
  <rect x="40" y="70" width="260" height="90" rx="6" class="store"/>
  <text x="170" y="94" text-anchor="middle" class="t">IndexedDB</text>
  <text x="170" y="112" text-anchor="middle" class="s">caption sessions: captions and bookmarks</text>
  <text x="170" y="128" text-anchor="middle" class="s">video index: title, bookmark count,</text>
  <text x="170" y="144" text-anchor="middle" class="s">last change, last sync times</text>
  <text x="170" y="190" text-anchor="middle" class="s">YouTube tabs reach it through a hidden</text>
  <text x="170" y="206" text-anchor="middle" class="s">extension frame. The bookmarks page and</text>
  <text x="170" y="222" text-anchor="middle" class="s">the background open it directly.</text>
  <rect x="40" y="252" width="260" height="60" rx="6" class="store"/>
  <text x="170" y="274" text-anchor="middle" class="t">youtube.com storage</text>
  <text x="170" y="292" text-anchor="middle" class="s">earlier versions' data, copied in once</text>
  <line x1="170" y1="248" x2="170" y2="232" class="line" marker-end="url(#a)"/>

  <!-- Server -->
  <rect x="360" y="70" width="280" height="90" rx="6" class="store"/>
  <text x="500" y="94" text-anchor="middle" class="t">Server (D1)</text>
  <text x="500" y="112" text-anchor="middle" class="s">videos, captions, and bookmarks per user</text>
  <text x="500" y="128" text-anchor="middle" class="s">last change per video</text>

  <line x1="304" y1="98" x2="356" y2="98" class="sync" marker-end="url(#g)"/>
  <line x1="304" y1="132" x2="356" y2="132" class="sync" marker-start="url(#g)"/>
  <text x="330" y="90" text-anchor="middle" class="st">push</text>
  <text x="330" y="150" text-anchor="middle" class="st">pull</text>

  <!-- Web app -->
  <rect x="680" y="30" width="300" height="300" rx="8" class="grp"/>
  <text x="694" y="52" class="gl">Web app <tspan class="s" font-weight="normal">(its own origin)</tspan></text>
  <rect x="700" y="70" width="260" height="90" rx="6" class="store"/>
  <text x="830" y="94" text-anchor="middle" class="t">IndexedDB</text>
  <text x="830" y="112" text-anchor="middle" class="s">caption sessions and video index,</text>
  <text x="830" y="128" text-anchor="middle" class="s">the same layout as the extension's</text>
  <line x1="696" y1="98" x2="644" y2="98" class="sync" marker-end="url(#g)"/>
  <line x1="696" y1="132" x2="644" y2="132" class="sync" marker-start="url(#g)"/>
  <text x="670" y="90" text-anchor="middle" class="st">push</text>
  <text x="670" y="150" text-anchor="middle" class="st">pull</text>

  <!-- Notes -->
  <text x="360" y="220" class="s">Green arrows: push and pull replace the receiving side's</text>
  <text x="360" y="236" class="s">copy of the whole video. Each origin keeps one store,</text>
  <text x="360" y="252" class="s">so the index is never copied between pages.</text>
</svg>
